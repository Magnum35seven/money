<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Accent Glow -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>

  <!-- App Icon Base (Rounded Square) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="8" />

  <!-- Currency Symbols & Conversion Graphic -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left Currency: AUD Symbol ($) -->
    <text x="140" y="240" font-family="-apple-system, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle">$</text>
    <text x="140" y="320" font-family="-apple-system, sans-serif" font-weight="700" font-size="42" fill="#94a3b8" text-anchor="middle">AUD</text>

    <!-- Right Currency: ZAR Symbol (R) -->
    <text x="370" y="240" font-family="-apple-system, sans-serif" font-weight="900" font-size="140" fill="#4ade80" text-anchor="middle">R</text>
    <text x="370" y="320" font-family="-apple-system, sans-serif" font-weight="700" font-size="42" fill="#94a3b8" text-anchor="middle">ZAR</text>

    <!-- Top Arrow (Left to Right) -->
    <path d="M 170 380 L 320 380" stroke="url(#arrowGrad)" stroke-width="24" />
    <path d="M 300 360 L 330 380 L 300 400" fill="url(#arrowGrad)" stroke="none" />

    <!-- Bottom Arrow (Right to Left) -->
    <path d="M 340 430 L 190 430" stroke="url(#arrowGrad)" stroke-width="24" stroke-opacity="0.5" />
    <path d="M 210 410 L 180 430 L 210 450" fill="url(#arrowGrad)" fill-opacity="0.5" stroke="none" />
    
  </g>
</svg>
